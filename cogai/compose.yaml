services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      COGAI_DATA_DIR: /app/data
    volumes:
      - cogai-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:7860:80"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  cogai-data:
